---
name: "CodeQL"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - prod
      - dev
  pull_request:
    branches:
      - prod
      - dev
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analyze-javascript:
    uses: timmo001/workflows/.github/workflows/codeql-javascript.yml@de4221cd9b24ad3d61aa1db87b6e4864cf56d5a1 # 20261027.0

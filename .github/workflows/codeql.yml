---
name: "CodeQL"

# yamllint disable-line rule:truthy
on:
  push:
    branches:
      - prod
      - dev
  pull_request:
    branches:
      - prod
      - dev
  schedule:
    - cron: "0 12 * * 4"
  workflow_dispatch:

concurrency:
  group: codeql-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  codeql-analyze-javascript:
    uses: timmo001/workflows/.github/workflows/codeql-javascript.yml@a76c7b0547b8e4c16fdbbdb9d2ba3cbab144b168 # 20261002.1
